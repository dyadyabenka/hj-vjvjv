# ---------------------------------------------------------------------------
# Настройки бота. Секретов здесь нет — они лежат в .env
# ---------------------------------------------------------------------------

# Тема канала. Подставляется в промпт синтеза, задаёт "редакционную политику".
channel_topic: "Паразитология, микрофлора кишечника и пробиотики: научно обоснованная информация"

# RSS-источники. name используется только в логах и в блоке "Источники:".
# Осознанно выбраны научно-популярные и научные издания, а не сайты,
# продающие "антипаразитарные капли/комплексы" — такие источники обычно
# не проходят проверку фактов и подрывают доверие к каналу.
sources:
  - name: "N+1 / Медицина"
    url: "https://nplus1.ru/rss"
  - name: "Наука и жизнь"
    url: "https://www.nkj.ru/rss/"
  - name: "Naked Science"
    url: "https://naked-science.ru/feedrss.xml"
  - name: "ПостНаука"
    url: "http://postnauka.ru/feed"
  - name: "Элементы.ру"
    url: "https://elementy.ru/rss/news"
  - name: "Habr / Биотехнологии"
    url: "https://habr.com/ru/rss/hub/biotech/all/?fl=ru"

# Сбор статей
fetch:
  # Статьи старше этого возраста считаются "устаревшими" и не берутся в новые.
  # Увеличено с 24 часов: тема не привязана к горячим новостям, подходит
  # и месячной давности статья про исследование, если оно актуально.
  max_age_hours: 720  # 30 дней
  # Сколько статей брать максимум из одной ленты (ленты бывают очень длинные)
  max_articles_per_source: 40
  # До скольки символов обрезать описание статьи (экономия токенов)
  description_max_chars: 1200
  # Таймаут загрузки одной ленты, секунды
  timeout_seconds: 20
  # Источники общенаучные (не только про паразитов/микробиом), поэтому
  # статья попадает в очередь, только если заголовок+описание содержат
  # хотя бы одно из этих слов (без учёта регистра). Пусто = без фильтра.
  keywords:
    - "паразит"
    - "гельминт"
    - "микробиом"
    - "микрофлор"
    - "кишечн"
    - "пробиотик"
    - "лактобактер"
    - "бифидобактер"
    - "дисбактериоз"
    - "глист"
    - "инвази"
    - "бактери"
    - "иммунитет"
    - "иммунн"
    - "вирус"
    - "инфекц"
    - "микроб"
    - "антибиотик"
    - "пищеварен"
    - "жкт"
    - "простейш"

# Группировка статей по темам
clustering:
  # Порог косинусного сходства TF-IDF (0..1).
  # Больше — кластеры мельче и точнее, меньше — крупнее и "грязнее".
  # На символьных n-граммах несвязанные заголовки дают 0.00-0.05,
  # статьи об одном событии — 0.25-0.55. Разумный диапазон: 0.20-0.35
  similarity_threshold: 0.25
  # Больше этого числа статей в один пост не отдаём (экономия токенов)
  max_articles_per_cluster: 6

# Синтез поста через LLM
synthesis:
  # Провайдер: "anthropic" или "deepseek".
  # DeepSeek отдаёт Anthropic-совместимый эндпоинт, поэтому используется
  # тот же SDK и тот же формат запроса — меняется только base_url и ключ.
  provider: "deepseek"
  # Модель. Для anthropic: claude-sonnet-4-6 (по умолчанию в ТЗ),
  # claude-opus-5 (умнее и дороже), claude-haiku-4-5 (быстрее и дешевле).
  # Для deepseek: deepseek-v4-flash (дёшево, достаточно для пересказа новостей),
  # deepseek-v4-pro (умнее, дороже).
  model: "deepseek-v4-flash"
  max_tokens: 2000
  # Сколько постов создавать за один запуск (защита от спама в канал)
  max_posts_per_run: 3

# Публикация в Telegram
publishing:
  # Показывать ли превью первой ссылки в посте (когда пост идёт без картинки)
  disable_web_page_preview: true

# Как часто прогонять конвейер сбора и подготовки черновиков (бот работает
# непрерывно, это не cron — расписание живёт внутри процесса)
run:
  interval_hours: 4

# Картинки к постам (реальные фото по теме, через Pexels API)
images:
  provider: "pexels"
  # Английские запросы-заглушки, если по статье не удалось подобрать
  # тематический запрос (см. images.py: pick_query)
  fallback_queries:
    - "science laboratory research"
    - "gut microbiome bacteria"
    - "medical research microscope"

# Хранилище
storage:
  db_path: "articles.db"
